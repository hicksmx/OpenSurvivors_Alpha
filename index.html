<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSurvivors</title>
    <style>
        /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            line-height: 1;
            font-family: Arial, sans-serif;
            background-color: #040218;
        }

        ol, ul {
            list-style: none;
        }

        img, video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        #start-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .file-input {
            margin: 10px 0;
            color: white;
        }
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #4a4a4a;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #start-btn:hover {
            background: #666;
        }
        #game-container {
            display: none;
        }
    </style>
</head>
<body>
    <div id="start-container">
        <h1>OpenSurvivors</h1>
        <div class="file-input">
            <label>Enemies Config:</label><br>
            <input type="file" id="enemies-file" accept=".json">
        </div>
        <div class="file-input">
            <label>Phases Config:</label><br>
            <input type="file" id="phases-file" accept=".json">
        </div>
        <button id="start-btn" disabled>Start Game</button>
    </div>
    <div id="game-container"></div>

    <script>
        let loadedFiles = {
            enemyConfig: null,
            phaseConfig: null
        };

        function checkAllFilesLoaded() {
            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = !Object.values(loadedFiles).every(v => v !== null);
        }

        function handleFileSelect(fileType, file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                loadedFiles[fileType] = JSON.parse(e.target.result);
                checkAllFilesLoaded();
            };
            reader.readAsText(file);
        }

        document.getElementById('enemies-file').onchange = (e) => {
            handleFileSelect('enemyConfig', e.target.files[0]);
        };

        document.getElementById('phases-file').onchange = (e) => {
            handleFileSelect('phaseConfig', e.target.files[0]);
        };

        document.getElementById('start-btn').onclick = () => {
            // Store configs in localStorage for GameScene to access
            localStorage.setItem('gameConfigs', JSON.stringify(loadedFiles));
            
            // Hide start container and show game
            document.getElementById('start-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            
            // Load game scripts
            const script = document.createElement('script');
            script.src = './phaser.js';
            script.onload = () => {
                const gameScript = document.createElement('script');
                gameScript.type = 'module';
                gameScript.src = './src/main.js';
                document.body.appendChild(gameScript);
            };
            document.body.appendChild(script);
        };
    </script>
</body>
</html>
